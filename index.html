<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chandelier Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { display: flex; height: 100vh; overflow: hidden; background: #1c1f26; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e8e8; }

  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #22252e;
    border-right: 1px solid #35394a;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 20px;
    z-index: 10;
  }

  #sidebar h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #d4aa6e;
    border-bottom: 1px solid #35394a;
    padding-bottom: 12px;
  }

  .control-group { display: flex; flex-direction: column; gap: 8px; }

  .control-group label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #999;
  }

  #pendant-number-display {
    font-size: 48px;
    font-weight: 700;
    color: #d4aa6e;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #number-input {
    width: 100%;
    background: #2a2e3a;
    border: 1px solid #454a5c;
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 14px;
    padding: 6px 10px;
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  #number-input:focus { border-color: #d4aa6e; }

  .coord-block {
    background: #272b36;
    border: 1px solid #35394a;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .coord-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .coord-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #999;
    width: 16px;
    flex-shrink: 0;
  }

  .coord-value {
    font-size: 13px;
    color: #eaeaea;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }

  .coord-row.c .coord-label { color: #7ec8e3; }
  .coord-row.y .coord-label { color: #8ee37e; }
  .coord-row.z .coord-label { color: #e3b07e; }

  .hint {
    font-size: 11px;
    color: #666;
    line-height: 1.6;
  }

  #rationalize-btn {
    width: 100%;
    padding: 9px 12px;
    background: #2a2e3a;
    border: 1px solid #454a5c;
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #rationalize-btn:hover { background: #353a4a; border-color: #d4aa6e; }
  #rationalize-btn.active {
    background: #3a2e1a;
    border-color: #d4aa6e;
    color: #d4aa6e;
  }

  #canvas-container { flex: 1; position: relative; }
  canvas { display: block; width: 100% !important; height: 100% !important; }

  /* ── Bottom slider bar ── */
  #slider-bar {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 48px));
    background: rgba(30, 34, 44, 0.88);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 170, 110, 0.35);
    border-radius: 16px;
    padding: 16px 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 20;
    box-shadow: 0 4px 32px rgba(0,0,0,0.5);
  }

  #slider-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  #slider-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #999;
  }

  #slider-readout {
    font-size: 18px;
    font-weight: 700;
    color: #d4aa6e;
    font-variant-numeric: tabular-nums;
  }

  #pendant-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, #d4aa6e 0%, #d4aa6e var(--pct, 0%), #3a3f52 var(--pct, 0%), #3a3f52 100%);
    outline: none;
    cursor: pointer;
  }
  #pendant-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d4aa6e;
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(212,170,110,0.25), 0 2px 8px rgba(0,0,0,0.5);
    transition: box-shadow 0.15s;
  }
  #pendant-slider::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 6px rgba(212,170,110,0.3), 0 2px 8px rgba(0,0,0,0.5);
  }
  #pendant-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d4aa6e;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 3px rgba(212,170,110,0.25), 0 2px 8px rgba(0,0,0,0.5);
  }

  #slider-endpoints {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #666;
    margin-top: -4px;
  }

  #tooltip {
    position: absolute;
    background: rgba(30,34,44,0.95);
    border: 1px solid #d4aa6e;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: #e8e8e8;
    pointer-events: none;
    display: none;
    white-space: nowrap;
    z-index: 30;
  }

  #theme-btn {
    width: 100%;
    padding: 9px 12px;
    background: #2a2e3a;
    border: 1px solid #454a5c;
    border-radius: 6px;
    color: #e8e8e8;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #theme-btn:hover { background: #353a4a; border-color: #d4aa6e; }

  /* ── Light mode overrides ── */
  body.light { background: #f0f0ec; color: #1a1a1a; }
  body.light #sidebar { background: #ffffff; border-right-color: #d0d0c8; }
  body.light #sidebar h1 { color: #8b6914; border-bottom-color: #d0d0c8; }
  body.light .control-group label { color: #666; }
  body.light #pendant-number-display { color: #8b6914; }
  body.light #number-input { background: #f5f5f0; border-color: #bbb; color: #1a1a1a; }
  body.light #number-input:focus { border-color: #8b6914; }
  body.light .coord-block { background: #f5f5f0; border-color: #d0d0c8; }
  body.light .coord-value { color: #1a1a1a; }
  body.light .hint { color: #999; }
  body.light #rationalize-btn { background: #f0f0ec; border-color: #bbb; color: #1a1a1a; }
  body.light #rationalize-btn:hover { background: #e8e8e0; border-color: #8b6914; }
  body.light #rationalize-btn.active { background: #f5e8cc; border-color: #8b6914; color: #8b6914; }
  body.light #theme-btn { background: #f0f0ec; border-color: #bbb; color: #1a1a1a; }
  body.light #theme-btn:hover { background: #e8e8e0; border-color: #8b6914; }
  body.light #slider-bar { background: rgba(255,255,252,0.92); border-color: rgba(139,105,20,0.35); }
  body.light #slider-label { color: #888; }
  body.light #slider-readout { color: #8b6914; }
  body.light #pendant-slider {
    background: linear-gradient(to right, #8b6914 0%, #8b6914 var(--pct, 0%), #ccc var(--pct, 0%), #ccc 100%);
  }
  body.light #pendant-slider::-webkit-slider-thumb { background: #8b6914; }
  body.light #pendant-slider::-moz-range-thumb { background: #8b6914; }
  body.light #slider-endpoints { color: #aaa; }
  body.light #tooltip { background: rgba(255,255,252,0.97); color: #1a1a1a; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Chandelier Viewer</h1>

  <div class="control-group">
    <label>Pendant</label>
    <div id="pendant-number-display">A1</div>
    <input type="text" id="number-input" value="A1" placeholder="e.g. G4">
  </div>

  <div class="coord-block">
    <div class="coord-row c">
      <span class="coord-label">X</span>
      <span class="coord-value" id="val-c">—</span>
    </div>
    <div class="coord-row y">
      <span class="coord-label">Y</span>
      <span class="coord-value" id="val-y">—</span>
    </div>
    <div class="coord-row z">
      <span class="coord-label">Z</span>
      <span class="coord-value" id="val-z">—</span>
    </div>
  </div>

  <button id="rationalize-btn">Rationalize</button>
  <button id="theme-btn">Light Mode</button>

  <p class="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom<br>Right-drag to pan<br>← → arrow keys to step</p>
</div>

<div id="canvas-container">
  <div id="tooltip"></div>

  <div id="slider-bar">
    <div id="slider-header">
      <span id="slider-label">Pendant</span>
      <span id="slider-readout">1 / 477</span>
    </div>
    <input type="range" id="pendant-slider" min="1" max="477" value="1" step="1">
    <div id="slider-endpoints"><span>A1</span><span>J53</span></div>
  </div>
</div>

// Grid label system: 9 rows (A-H,J skipping I) × 53 columns
const GRID_ROWS = ['A','B','C','D','E','F','G','H','J'];
const GRID_COLS = 53;

function gridLabel(idx) { // 0-based index → e.g. "G4"
  return GRID_ROWS[Math.floor(idx / GRID_COLS)] + ((idx % GRID_COLS) + 1);
}

function parseGridLabel(str) { // "G4" → 0-based index, or -1 if invalid
  str = str.trim().toUpperCase();
  if (str.length < 2) return -1;
  const letter = str[0];
  const col = parseInt(str.slice(1), 10);
  const rowIdx = GRID_ROWS.indexOf(letter);
  if (rowIdx === -1 || isNaN(col) || col < 1 || col > GRID_COLS) return -1;
  return rowIdx * GRID_COLS + (col - 1);
}

// Convert inches to feet for display in Three.js scene (1 unit = 1 foot)
const pendants = RAW.map((r, i) => ({
  index: i,
  grid: gridLabel(i),
  cRaw: r[0], yRaw: r[1], zRaw: r[2],
  x: r[3] / 12,  // C → Three.js X
  z: -r[4] / 12,  // Y → Three.js Z (depth/length, negated to match physical orientation)
  y: r[5] / 12,  // Z → Three.js Y (elevation)
}));

// Center the scene
const cx = (Math.min(...pendants.map(p => p.x)) + Math.max(...pendants.map(p => p.x))) / 2;
const cy = (Math.min(...pendants.map(p => p.y)) + Math.max(...pendants.map(p => p.y))) / 2;
const cz = (Math.min(...pendants.map(p => p.z)) + Math.max(...pendants.map(p => p.z))) / 2;
pendants.forEach(p => { p.x -= cx; p.y -= cy; p.z -= cz; });

// Ceiling at 51'2" = 614 inches = 614/12 feet, offset by same cy used for pendant Y
const ceilingY = (614 / 12) - cy;

// --- Scene setup ---
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x1c1f26);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(-20, 12, 35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.5);
fillLight.position.set(-10, -5, -10);
scene.add(fillLight);

// Grid helper (subtle)
let grid = new THREE.GridHelper(60, 20, 0x222233, 0x1a1a2a);
grid.position.y = 0;
scene.add(grid);
function setGridColors(centerColor, gridColor) {
  scene.remove(grid);
  grid.geometry.dispose();
  grid.material.dispose();
  grid = new THREE.GridHelper(60, 20, centerColor, gridColor);
  grid.position.y = 0;
  scene.add(grid);
}

// Pendant geometry (shared)
const geo = new THREE.SphereGeometry(0.12, 10, 6);
const matNormal = new THREE.MeshStandardMaterial({ color: 0xaabbdd, roughness: 0.4, metalness: 0.3 });
const matSelected = new THREE.MeshStandardMaterial({ color: 0xc8a96e, roughness: 0.2, metalness: 0.8, emissive: 0xc8a96e, emissiveIntensity: 0.4 });

// Build instanced mesh for normal pendants
const instancedMesh = new THREE.InstancedMesh(geo, matNormal, pendants.length);
instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const dummy = new THREE.Object3D();
pendants.forEach((p, i) => {
  dummy.position.set(p.x, p.y, p.z);
  dummy.updateMatrix();
  instancedMesh.setMatrixAt(i, dummy.matrix);
});
instancedMesh.instanceMatrix.needsUpdate = true;
scene.add(instancedMesh);

// Wires from each pendant up to ceiling
const wirePositions = new Float32Array(pendants.length * 6); // 2 points × 3 components
pendants.forEach((p, i) => {
  wirePositions[i * 6 + 0] = p.x;
  wirePositions[i * 6 + 1] = p.y;
  wirePositions[i * 6 + 2] = p.z;
  wirePositions[i * 6 + 3] = p.x;
  wirePositions[i * 6 + 4] = ceilingY;
  wirePositions[i * 6 + 5] = p.z;
});
const wireGeo = new THREE.BufferGeometry();
wireGeo.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({ color: 0xddeeff, transparent: true, opacity: 0.85 });
scene.add(new THREE.LineSegments(wireGeo, wireMat));

// Ceiling plane
const ceilGeo = new THREE.PlaneGeometry(12, 48);
const ceilMat = new THREE.MeshStandardMaterial({ color: 0x2a2e3c, roughness: 1, metalness: 0, side: THREE.DoubleSide });
const ceilMesh = new THREE.Mesh(ceilGeo, ceilMat);
ceilMesh.rotation.x = Math.PI / 2;
ceilMesh.position.y = ceilingY;
scene.add(ceilMesh);

// Selected pendant sphere
const selMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 10), matSelected);
scene.add(selMesh);

// Glow ring around selected pendant
const ringGeo = new THREE.TorusGeometry(0.35, 0.03, 6, 24);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xc8a96e, transparent: true, opacity: 0.6 });
const ring = new THREE.Mesh(ringGeo, ringMat);
scene.add(ring);

// Vertical drop line
const dropMat = new THREE.LineBasicMaterial({ color: 0xc8a96e, transparent: true, opacity: 0.4 });
const dropGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -4, 0)]);
const dropLine = new THREE.Line(dropGeo, dropMat);
scene.add(dropLine);

// --- UI wiring ---
let currentIndex = 0; // 0-based internal

const slider = document.getElementById('pendant-slider');
const numInput = document.getElementById('number-input');
const displayNum = document.getElementById('pendant-number-display');
const sliderReadout = document.getElementById('slider-readout');
const valC = document.getElementById('val-c');
const valY = document.getElementById('val-y');
const valZ = document.getElementById('val-z');

function selectPendant(oneBasedNum) {
  const n = Math.max(1, Math.min(477, Math.round(oneBasedNum)));
  const idx = n - 1;
  currentIndex = idx;

  const label = gridLabel(idx);
  slider.value = n;
  numInput.value = label;
  displayNum.textContent = label;
  sliderReadout.textContent = label;
  const pct = ((n - 1) / 476 * 100).toFixed(2);
  slider.style.setProperty('--pct', pct + '%');

  const p = pendants[idx];
  valC.textContent = p.cRaw;
  valY.textContent = p.yRaw;
  valZ.textContent = rationalized ? fmtRatZ(RAT_Z[idx]) : p.zRaw;

  // Move selected sphere
  selMesh.position.set(p.x, p.y, p.z);
  ring.position.set(p.x, p.y, p.z);
  dropLine.geometry.setFromPoints([
    new THREE.Vector3(p.x, p.y, p.z),
    new THREE.Vector3(p.x, p.y - 4, p.z),
  ]);
}

slider.addEventListener('input', () => selectPendant(parseInt(slider.value)));
numInput.addEventListener('input', () => {
  const idx = parseGridLabel(numInput.value);
  if (idx !== -1) selectPendant(idx + 1);
});
numInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { e.preventDefault(); selectPendant(currentIndex + 2); }
  if (e.key === 'ArrowDown') { e.preventDefault(); selectPendant(currentIndex); }
});

// Keyboard arrow keys on body
document.addEventListener('keydown', e => {
  if (document.activeElement === numInput) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') selectPendant(currentIndex + 2);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') selectPendant(currentIndex);
});

// Hover tooltip
const tooltip = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('mousemove', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(instancedMesh);
  if (hits.length > 0) {
    const p = pendants[hits[0].instanceId];
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 8) + 'px';
    tooltip.textContent = `Pendant ${p.grid}  C: ${p.cRaw}  Y: ${p.yRaw}  Z: ${fmtRatZ(RAT_Z[p.index])}`;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
});

renderer.domElement.addEventListener('click', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(instancedMesh);
  if (hits.length > 0) selectPendant(hits[0].instanceId + 1);
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Rationalize toggle
const origY = pendants.map(p => p.y);
let rationalized = true;

function fmtRatZ(inches) {
  const ft = Math.floor(inches / 12);
  const inch = inches % 12;
  return `${ft}' - ${inch}"`;
}

function applyZMode(useRat) {
  rationalized = useRat;
  pendants.forEach((p, i) => {
    p.y = useRat ? (RAT_Z[i] / 12 - cy) : origY[i];
  });
  pendants.forEach((p, i) => {
    dummy.position.set(p.x, p.y, p.z);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
  });
  instancedMesh.instanceMatrix.needsUpdate = true;
  pendants.forEach((p, i) => {
    wirePositions[i * 6 + 1] = p.y;
  });
  wireGeo.attributes.position.needsUpdate = true;
  selectPendant(currentIndex + 1);
  const btn = document.getElementById('rationalize-btn');
  btn.textContent = useRat ? 'Restore Precise' : 'Rationalize';
  btn.classList.toggle('active', useRat);
}

document.getElementById('rationalize-btn').addEventListener('click', () => applyZMode(!rationalized));

// Theme toggle
let lightMode = false;
const themeBtn = document.getElementById('theme-btn');
themeBtn.addEventListener('click', () => {
  lightMode = !lightMode;
  document.body.classList.toggle('light', lightMode);
  themeBtn.textContent = lightMode ? 'Dark Mode' : 'Light Mode';
  renderer.setClearColor(lightMode ? 0xf0f0ec : 0x1c1f26);
  setGridColors(lightMode ? 0xbbbbaa : 0x222233, lightMode ? 0xccccbb : 0x1a1a2a);
  ceilMesh.material.color.set(lightMode ? 0xe0e0d8 : 0x2a2e3c);
  wireMat.color.set(lightMode ? 0x000000 : 0xddeeff);
  wireMat.opacity = lightMode ? 1.0 : 0.85;
  wireMat.needsUpdate = true;
  matNormal.color.set(lightMode ? 0x335577 : 0xaabbdd);
});

// Animate
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.02;
  ring.rotation.y = t;
  controls.update();
  renderer.render(scene, camera);
}

applyZMode(true);
animate();
</script>
</body>
</html>
